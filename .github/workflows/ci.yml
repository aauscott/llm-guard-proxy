name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12", "3.13"]

    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - run: python -m pip install -e ".[dev]"
      - run: pytest
      - run: python -m build
      - name: Test the built package
        run: |
          python -m venv /tmp/package-test
          /tmp/package-test/bin/python -m pip install dist/*.whl
          /tmp/package-test/bin/llm-guard-proxy --version
          cd /tmp
          /tmp/package-test/bin/python -c \
            "from llm_guard_proxy.policy.loader import load_policy; assert load_policy('permissive').name == 'permissive'"
