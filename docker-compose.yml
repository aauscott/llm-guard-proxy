services:
  llm-guard-proxy:
    build:
      context: .
      dockerfile: Dockerfile
    environment:
      GUARD_POLICY_PATH: permissive
      GUARD_UPSTREAM_BASE_URL: ${GUARD_UPSTREAM_BASE_URL:-https://api.openai.com}
      GUARD_UPSTREAM_API_KEY: ${OPENAI_API_KEY:-}
      GUARD_CLASSIFIER_TIMEOUT_MS: "750"
      GUARD_LOG_LEVEL: INFO
    ports:
      - "8000:8000"
    volumes:
      - .:/app
    command: llm-guard-proxy --host 0.0.0.0 --reload

  ollama:
    image: ollama/ollama:latest
    profiles:
      - ollama
    ports:
      - "11434:11434"
    volumes:
      - ollama-data:/root/.ollama

volumes:
  ollama-data:
