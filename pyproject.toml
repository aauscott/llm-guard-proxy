[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "llm-guard-proxy"
version = "0.1.0"
description = "Local-first OpenAI-compatible LLM security proxy with policy-driven guardrails."
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
license-files = ["LICENSE"]
keywords = ["llm", "security", "guardrails", "openai", "prompt-injection"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Topic :: Security",
]
dependencies = [
  "fastapi>=0.115.0",
  "httpx>=0.27.0",
  "pydantic>=2.8.0",
  "pydantic-settings>=2.4.0",
  "PyYAML>=6.0.2",
  "uvicorn[standard]>=0.30.0",
]

[project.optional-dependencies]
dev = [
  "build>=1.2.2",
  "pytest>=8.3.0",
  "pytest-asyncio>=0.24.0",
  "respx>=0.21.1",
]
notebook = [
  "jupyterlab>=4.2.0",
]

[project.scripts]
llm-guard-proxy = "llm_guard_proxy.cli:main"

[project.urls]
Homepage = "https://github.com/aauscott/llm-guard-proxy"
Repository = "https://github.com/aauscott/llm-guard-proxy"
Issues = "https://github.com/aauscott/llm-guard-proxy/issues"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
llm_guard_proxy = ["policies/*.yaml"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
