name: permissive
description: Low-friction local development policy.
mode: fail_open
defaults:
  classifier_timeout_ms: 750
  log_prompts: false
  canned_response: I can't help with that request. I ignored that message, so you
    can continue with a different question.
stages:
  input:
    enabled_classifiers:
    - terms
    - regex
    - secrets
    - prompt_injection
  output:
    enabled_classifiers:
    - terms
    - regex
    - secrets
actions:
  critical: block
  high: warn
  medium: log
  low: log
terms:
  critical: []
  high: []
  medium: []
  low: []
regex:
  rules:
  - name: private_key_header
    pattern: '-----BEGIN (RSA|OPENSSH|EC|DSA)? ?PRIVATE KEY-----'
    category: secret_leak
    severity: critical
